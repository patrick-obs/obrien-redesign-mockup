<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>Presentation builder | O'Brien Systems</title><link rel="stylesheet" href="assets/style.css?v=muftslqc"><style id="pz-css"></style></head><body>
<style>
.pb{max-width:1100px;margin:0 auto;padding:32px 16px 60px}.pb h1{margin:.2em 0}.pb .lead{color:#5b6b6c;max-width:720px}
.pb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;margin-top:22px}@media (max-width:860px){.pb-grid{grid-template-columns:1fr}}
.pb label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 5px}.pb input[type=text],.pb input[type=email],.pb textarea,.pb select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cfdada;border-radius:10px;font:inherit}
.pb textarea{min-height:90px}.pb fieldset{border:1px solid #dfe8e8;border-radius:12px;padding:10px 14px;margin:0 0 12px}.pb legend{font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#1d2a2b;padding:0 6px}
.pb .chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:.9rem;margin:5px 0}.pb .chk input{margin-top:3px}
.pb-models{max-height:640px;overflow:auto;padding-right:6px}.pb-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.pb-bar .btn{cursor:pointer}
.pb-out{margin-top:14px;padding:12px;border-radius:10px;background:#f2f6f6;word-break:break-all;font-size:.85rem;display:none}.pb-count{color:#5b6b6c;font-size:.85rem;margin-left:6px}
</style>
<div class="pb">
  <span class="eyebrow">Internal tool</span><h1>Customer presentation builder</h1>
  <p class="lead">Pick what a customer should see. You get a link to send, or a single HTML file you can email or open offline. The 3D models run right in it: turn them, open doors and drawers, walk the aisles.</p>
  <div class="pb-grid">
    <div>
      <label for="pb-n">Customer</label><input id="pb-n" type="text" placeholder="Customer or project name">
      <label for="pb-t">Headline</label><input id="pb-t" type="text" placeholder="Storage built around how you work">
      <label for="pb-p">Message</label><textarea id="pb-p" placeholder="A few lines about their project, in your words."></textarea>
      <label for="pb-by">Prepared by</label><input id="pb-by" type="text" placeholder="Your name">
      <label for="pb-em">Email</label><input id="pb-em" type="email" placeholder="sales@obriensys.com">
      <label for="pb-ph">Phone</label><input id="pb-ph" type="text" placeholder="610.825.3405">
      <label for="pb-ind">Start from an industry or product</label><select id="pb-ind"><option value="">Choose to fill in the models</option><option value="four-post-shelving">4-Post Shelving</option><option value="bin-storage">Bin & Parts Storage</option><option value="wire-shelving">Wire Shelving</option><option value="cantilever-shelving">Cantilever & Library Shelving</option><option value="static-shelving">Static Shelving</option><option value="high-density-mobile-storage">High-Density Mobile Storage</option><option value="lockers">Lockers</option><option value="evidence-lockers">Evidence Lockers</option><option value="cabinets">Cabinets</option><option value="rotary-cabinets">Rotary Cabinets</option><option value="museum-cabinets">Museum Cabinets</option><option value="art-screens">Art Screens & Racks</option><option value="pallet-rack">Pallet Rack</option><option value="mezzanines">Mezzanines & Platforms</option><option value="lifts-carousels">Lifts & Carousels (VLM)</option><option value="modular-casework">Modular Casework</option><option value="wire-partitions">Wire Partitions & Cages</option><option value="weapons-storage">Weapons & Gun Storage</option><option value="athletic-storage">Athletic Equipment Storage</option><option value="athletics">Athletics</option><option value="mail-sorters">Mail Sorters & Mailroom</option><option value="fireproof-cabinets">Fireproof & Safety Cabinets</option><option value="wardrobe-cabinets">Wardrobe & Uniform Cabinets</option><option value="military">Military</option><option value="museums">Museums</option><option value="libraries">Libraries</option><option value="material-handling-warehouse">Material Handling & Warehouse</option><option value="vertical-farming">Vertical Farming</option><option value="pharmaceutical-healthcare">Healthcare & Pharmaceutical</option><option value="education">Education</option><option value="government-public-safety">Government & Public Safety</option><option value="corporate-legal">Corporate & Legal</option><option value="automotive">Automotive</option><option value="retail">Retail</option><option value="general-contractors">GCs, Architects & Owners</option></select>
      <label class="chk"><input id="pb-full" type="checkbox"> Let them change every option (otherwise they see each system as set up)</label>
      <div class="pb-bar"><button class="btn btn-solid" id="pb-open" type="button">Preview</button><button class="btn" id="pb-copy" type="button">Copy link</button><button class="btn" id="pb-dl" type="button">Download HTML file</button></div>
      <div class="pb-out" id="pb-out"></div>
    </div>
    <div><label>Models to show <span class="pb-count" id="pb-count"></span></label><div class="pb-models" id="pb-models"></div></div>
  </div>
</div>
<script type="module">
import { enc, standalone } from './assets/present.js?v=muftslqc';
const { MODELS } = await import('./assets/3d/models.js?v=muftslqc');
const GROUPS = [["Mobile systems",["hd-mobile","hd-mobile-open","hd-mobile-library","hd-mobile-flat","hd-mobile-museum","hd-mobile-bins","hd-mobile-art","hd-mobile-artrack","hd-mobile-textile","hd-mobile-wardrobe","hd-mobile-gear","hd-mobile-golf","hd-mobile-instruments","hd-mobile-weapons","hd-mobile-tire","hd-mobile-grow","hd-mobile-pallet","hd-mobile-mezz","wire-track"]],["Automated",["vlm","rotary"]],["Shelving & racks",["four-post","four-post-solander","bin-shelving","wire-shelving","library","tire-rack","pallet-rack","pallet-museum"]],["Lockers & security",["lockers","athletic","evidence-lockers","weapons"]],["Cabinets",["flat-files","fireproof","museum-cabinet","wardrobe"]],["Museum & art",["art-screens","wall-art","painting-bins","textile-rack","wall-etrack"]],["Workspace",["casework","workstation","ss-table","mail-sorter"]],["Buildings",["mezzanine","wire-cage","bike-storage","install"]]], IND = [{"s":"four-post-shelving","n":"4-Post Shelving","m":["four-post"]},{"s":"bin-storage","n":"Bin & Parts Storage","m":["bin-shelving"]},{"s":"wire-shelving","n":"Wire Shelving","m":["wire-shelving","wire-track"]},{"s":"cantilever-shelving","n":"Cantilever & Library Shelving","m":["library","hd-mobile-library"]},{"s":"static-shelving","n":"Static Shelving","m":["four-post","bin-shelving","wire-shelving","library","tire-rack"]},{"s":"high-density-mobile-storage","n":"High-Density Mobile Storage","m":["hd-mobile","hd-mobile-museum","hd-mobile-flat","hd-mobile-artrack","hd-mobile-pallet","hd-mobile-mezz","wire-track"]},{"s":"lockers","n":"Lockers","m":["lockers","athletic","evidence-lockers","weapons"]},{"s":"evidence-lockers","n":"Evidence Lockers","m":["evidence-lockers"]},{"s":"cabinets","n":"Cabinets","m":["flat-files","fireproof","rotary","museum-cabinet"]},{"s":"rotary-cabinets","n":"Rotary Cabinets","m":["rotary"]},{"s":"museum-cabinets","n":"Museum Cabinets","m":["museum-cabinet","hd-mobile-museum","four-post-solander","textile-rack","hd-mobile-textile"]},{"s":"art-screens","n":"Art Screens & Racks","m":["art-screens","wall-art","hd-mobile-art","painting-bins","hd-mobile-bins","wall-etrack"]},{"s":"pallet-rack","n":"Pallet Rack","m":["pallet-rack","hd-mobile-pallet"]},{"s":"mezzanines","n":"Mezzanines & Platforms","m":["mezzanine","hd-mobile-mezz"]},{"s":"lifts-carousels","n":"Lifts & Carousels (VLM)","m":["vlm"]},{"s":"modular-casework","n":"Modular Casework","m":["casework","ss-table"]},{"s":"wire-partitions","n":"Wire Partitions & Cages","m":["wire-cage","bike-storage"]},{"s":"weapons-storage","n":"Weapons & Gun Storage","m":["weapons","hd-mobile-weapons"]},{"s":"athletic-storage","n":"Athletic Equipment Storage","m":["athletic","hd-mobile-gear","lockers"]},{"s":"athletics","n":"Athletics","m":["athletic","hd-mobile-gear","hd-mobile-golf","lockers"]},{"s":"mail-sorters","n":"Mail Sorters & Mailroom","m":["mail-sorter"]},{"s":"fireproof-cabinets","n":"Fireproof & Safety Cabinets","m":["fireproof"]},{"s":"wardrobe-cabinets","n":"Wardrobe & Uniform Cabinets","m":["wardrobe","hd-mobile-wardrobe"]},{"s":"military","n":"Military","m":["weapons","hd-mobile-weapons","pallet-rack","hd-mobile-pallet"]},{"s":"museums","n":"Museums","m":["four-post-solander","painting-bins","hd-mobile-bins","art-screens","wall-art","hd-mobile-art","hd-mobile-artrack","wall-etrack","museum-cabinet","hd-mobile-museum","textile-rack","hd-mobile-textile"]},{"s":"libraries","n":"Libraries","m":["library","hd-mobile-library"]},{"s":"material-handling-warehouse","n":"Material Handling & Warehouse","m":["hd-mobile-open","hd-mobile-pallet","hd-mobile-mezz","pallet-rack","mezzanine","vlm","bin-shelving","workstation","wire-cage","wall-etrack"]},{"s":"vertical-farming","n":"Vertical Farming","m":["hd-mobile-grow","ss-table","wire-track"]},{"s":"pharmaceutical-healthcare","n":"Healthcare & Pharmaceutical","m":["casework","ss-table","wire-track","hd-mobile"]},{"s":"education","n":"Education","m":["lockers","bike-storage","athletic","hd-mobile-gear","hd-mobile-instruments","library","hd-mobile","mail-sorter"]},{"s":"government-public-safety","n":"Government & Public Safety","m":["evidence-lockers","weapons","hd-mobile-weapons","hd-mobile","wire-cage"]},{"s":"corporate-legal","n":"Corporate & Legal","m":["hd-mobile","rotary","fireproof","hd-mobile-flat","mail-sorter"]},{"s":"automotive","n":"Automotive","m":["tire-rack","hd-mobile-tire","bin-shelving","workstation","pallet-rack","vlm"]},{"s":"retail","n":"Retail","m":["hd-mobile","four-post","bin-shelving","wire-track"]},{"s":"general-contractors","n":"GCs, Architects & Owners","m":["install","hd-mobile","mezzanine"]}], LOGO = "/assets/media/2026/06/b699d-obrien-logo-web.png";
const $ = id => document.getElementById(id), box = $('pb-models');
box.innerHTML = GROUPS.map(([g, ids]) => '<fieldset><legend>' + g + '</legend>' + ids.filter(id => MODELS[id]).map(id => '<label class="chk"><input type="checkbox" value="' + id + '"> ' + MODELS[id].name + '</label>').join('') + '</fieldset>').join('');
const boxes = () => [...box.querySelectorAll('input')];
const count = () => { const n = boxes().filter(b => b.checked).length; $('pb-count').textContent = n ? n + ' selected' : ''; };
let order = [];
box.addEventListener('change', count);
$('pb-ind').addEventListener('change', e => { const i = IND.find(x => x.s === e.target.value); if (!i) return; boxes().forEach(b => { b.checked = i.m.includes(b.value); }); order = i.m.slice(); count(); });
const cfg = () => { const chosen = boxes().filter(b => b.checked).map(b => b.value), m = [...order.filter(id => chosen.includes(id)), ...chosen.filter(id => !order.includes(id))];
  return { n: $('pb-n').value.trim(), t: $('pb-t').value.trim(), p: $('pb-p').value.trim(), m, full: $('pb-full').checked, by: $('pb-by').value.trim(), em: $('pb-em').value.trim(), ph: $('pb-ph').value.trim() }; };
const link = () => new URL('present.html?c=' + enc(cfg()), location.href).href;
const say = t => { const o = $('pb-out'); o.style.display = 'block'; o.textContent = t; };
const need = () => { if (!cfg().m.length) { say('Pick at least one model.'); return false; } return true; };
$('pb-open').addEventListener('click', () => { if (need()) open(link(), '_blank'); });
$('pb-copy').addEventListener('click', async () => { if (!need()) return; const l = link(); try { await navigator.clipboard.writeText(l); say('Link copied: ' + l); } catch { say(l); } });
$('pb-dl').addEventListener('click', async () => {
  if (!need()) return; say('Building the file...');
  try {
    const c = cfg(), html = await standalone({ ...c, logoPath: LOGO.replace(/^\//, '') });
    const slug = (c.n || 'presentation').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'presentation', name = 'obrien-' + slug + '.html';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = name; a.click();
    say('Downloaded ' + name + ' (' + (html.length / 1048576).toFixed(1) + ' MB). It opens in any modern browser, online or off.');
  } catch (err) { say('Could not build the file: ' + err.message); }
});
</script></body></html>
