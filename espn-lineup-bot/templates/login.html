{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block body %}
<div class="card login">
  <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="" width="355" height="640">
  <h1>Fantasy Advisor</h1>
  <p class="lede">Every league, the best lineup, one button.</p>
  {% if not configured %}<p class="bad">APP_PASSWORD is not set on the server, so nobody can log in yet.</p>{% endif %}
  <form method="post">
    <label for="password">Passphrase</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    <p><button class="btn big" type="submit">Enter</button></p>
  </form>
</div>
{% endblock %}
