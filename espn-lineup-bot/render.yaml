# Render.com blueprint: connect the repo, Render reads this file and asks for the env vars.
services:
  - type: web
    name: fantasy-advisor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 120 app:app
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ESPN_S2
        sync: false
      - key: SWID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
